apiVersion: v1
kind: Secret
metadata:
  name: nirmata-api-credentials
  namespace: ottoflow
type: Opaque
stringData:
  # ── Nirmata (required) ────────────────────────────────────────────────────
  apiKey: "your-nirmata-api-key-here"
  nirmataUrl: "nirmata.example.com"

  # ── Proxy (optional) ──────────────────────────────────────────────────────
  httpsProxy: ""
  noProxy: "localhost,127.0.0.1"

  # ── Slack alerts (optional) ───────────────────────────────────────────────
  #
  # Choose ONE of the two methods below:
  #
  # METHOD A — Incoming Webhook (simpler, channel fixed at webhook creation)
  #   1. Go to https://api.slack.com/apps → Your App → Incoming Webhooks
  #   2. "Add New Webhook to Workspace" → pick the channel (e.g. #production-nch)
  #   3. Copy the webhook URL here
  #   Leave slackToken and slackChannel blank when using this method.
  #
  slackWebhookUrl: ""
  #   Example: "https://hooks.slack.com/services/T00000/B00000/XXXXXXXX"

  # METHOD B — Bot Token (flexible, change channel/recipient without new webhook)
  #   1. Go to https://api.slack.com/apps → Your App → OAuth & Permissions
  #   2. Add scope: chat:write
  #   3. Install to workspace, copy the "Bot User OAuth Token" (starts with xoxb-)
  #   4. Set slackChannel to a channel name (#production-nch), channel ID (C1234),
  #      or a user ID (U1234) for a direct message to that person.
  #
  slackToken: ""
  #   Paste your Bot User OAuth Token here (starts with xoxb-)
  slackChannel: "#production-nch"
  #   For DM to a user: find their User ID in Slack → Profile → ⋮ → Copy member ID
  #   e.g. "U04ABCDE123"

  # ── Alert mentions (optional, works with both methods) ────────────────────
  #   Comma-separated Slack user IDs to @-mention in the alert.
  #   Find a user ID: Slack → click their name → ⋮ → Copy member ID
  slackMentions: ""
  #   Example: "U04ABCDE123,U04FGHIJ456"
