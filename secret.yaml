apiVersion: v1
kind: Secret
metadata:
  name: nirmata-api-credentials
  namespace: ottoflow
type: Opaque
stringData:
  # Required
  apiKey: "your-nirmata-api-key-here"
  nirmataUrl: "nirmata.example.com"
  # Optional — leave empty string if no proxy
  httpsProxy: ""
  noProxy: "localhost,127.0.0.1"
