display_information:
  name: Nirmata Report Bot
  description: Runs Nirmata version and health reports on demand
  background_color: "#0f3460"

features:
  bot_user:
    display_name: Nirmata Report Bot
    always_online: true
  slash_commands:
    - command: /nirmata-report
      description: Run a Nirmata version and health report
      usage_hint: "[upload kubeconfig when prompted]"
      should_escape: false

oauth_config:
  scopes:
    bot:
      - chat:write           # Send messages and DMs
      - chat:write.public    # Post to channels without joining
      - files:read           # Download uploaded kubeconfig files
      - files:write          # Upload HTML report as a file
      - im:write             # Open DM channels
      - commands             # Slash commands

settings:
  interactivity:
    is_enabled: true
    request_url: https://YOUR_HOST/slack/actions   # replace with your server URL
  event_subscriptions:
    request_url: https://YOUR_HOST/slack/events    # replace with your server URL
    bot_events:
      - message.im           # Receive DMs (for kubeconfig file uploads)
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
